name: Release
# Push a tag like v0.2.0 (matching the VERSION file) and the .pkg / .tar.gz / SHA256SUMS are built and published.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: |
          [ "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION $(cat VERSION)"; exit 1; }
      - name: Build
        run: ./packaging/build_release.sh
      - name: Stable-name copies (for the one-line installer)
        run: |
          cp dist/amq-cheatsheets-*.tar.gz dist/amq-cheatsheets.tar.gz
          cp dist/amq-cheatsheets-*.pkg dist/amq-cheatsheets.pkg
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "amq-cheatsheets ${GITHUB_REF_NAME}" --generate-notes
